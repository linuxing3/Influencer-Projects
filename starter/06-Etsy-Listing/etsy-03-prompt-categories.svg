<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="2400" viewBox="0 0 3000 2400">
    <style>
.title{font-family:Arial,Helvetica,sans-serif;font-weight:900;letter-spacing:-2px;fill:#fff}
.sub{font-family:Arial,Helvetica,sans-serif;font-weight:700;fill:#f8fafc}
.small{font-family:Arial,Helvetica,sans-serif;font-weight:600;fill:#cbd5e1}
.dark{font-family:Arial,Helvetica,sans-serif;font-weight:900;fill:#111827}
.muted{font-family:Arial,Helvetica,sans-serif;font-weight:700;fill:#475569}
.tag{font-family:Arial,Helvetica,sans-serif;font-weight:800;fill:#0f172a}
</style>
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#080816"/>
        <stop offset="45%" stop-color="#4c1d95"/>
        <stop offset="100%" stop-color="#fb923c"/>
      </linearGradient>
      <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#f8fafc"/>
      </linearGradient>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#000" flood-opacity="0.35"/>
      </filter>
      <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="45"/>
      </filter>
    </defs>
    
    
<rect width="100%" height="100%" fill="url(#bg)"/>
<text x="150" y="230" class="title" font-size="120">100 Copy-Paste Prompts</text>
<text x="155" y="335" class="small" font-size="48">10 chapters designed for AI influencer content creation</text>
<rect x="150" y="520" width="1190" height="170" rx="36" fill="#fff" filter="url(#shadow)"/><text x="220" y="630" class="tag" font-size="58">1. Selfies</text><rect x="1480" y="520" width="1190" height="170" rx="36" fill="#fff" filter="url(#shadow)"/><text x="1550" y="630" class="tag" font-size="58">2. Travel</text><rect x="150" y="780" width="1190" height="170" rx="36" fill="#fff" filter="url(#shadow)"/><text x="220" y="890" class="tag" font-size="58">3. Coffee Shop</text><rect x="1480" y="780" width="1190" height="170" rx="36" fill="#fff" filter="url(#shadow)"/><text x="1550" y="890" class="tag" font-size="58">4. Luxury</text><rect x="150" y="1040" width="1190" height="170" rx="36" fill="#fff" filter="url(#shadow)"/><text x="220" y="1150" class="tag" font-size="58">5. Fashion</text><rect x="1480" y="1040" width="1190" height="170" rx="36" fill="#fff" filter="url(#shadow)"/><text x="1550" y="1150" class="tag" font-size="58">6. Holidays</text><rect x="150" y="1300" width="1190" height="170" rx="36" fill="#fff" filter="url(#shadow)"/><text x="220" y="1410" class="tag" font-size="58">7. Engagement</text><rect x="1480" y="1300" width="1190" height="170" rx="36" fill="#fff" filter="url(#shadow)"/><text x="1550" y="1410" class="tag" font-size="58">8. Brand Promo</text><rect x="150" y="1560" width="1190" height="170" rx="36" fill="#fff" filter="url(#shadow)"/><text x="220" y="1670" class="tag" font-size="58">9. Video Scenes</text><rect x="1480" y="1560" width="1190" height="170" rx="36" fill="#fff" filter="url(#shadow)"/><text x="1550" y="1670" class="tag" font-size="58">10. Face Consistency</text>
<text x="150" y="2220" class="small" font-size="52">Use with your favorite AI image or video generator</text>

    </svg>