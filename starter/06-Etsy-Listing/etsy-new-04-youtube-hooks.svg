<text x="245" y="675" class="muted" font-size="58">“I built an AI content brand in 7 days.”</text><text x="245" y="825" class="muted" font-size="58">“Nobody talks about this AI creator workflow.”</text><text x="245" y="975" class="muted" font-size="58">“Steal this prompt system for your next 30 posts.”</text><text x="245" y="1125" class="muted" font-size="58">“This is how faceless creators plan content faster.”</text>
