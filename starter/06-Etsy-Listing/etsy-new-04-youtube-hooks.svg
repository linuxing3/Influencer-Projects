    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#080817"/>
        <stop offset="45%" stop-color="#43208d"/>
        <stop offset="100%" stop-color="#fb7a21"/>
