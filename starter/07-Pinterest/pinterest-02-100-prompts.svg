<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500">
    <style>
.title{font-family:Arial,Helvetica,sans-serif;font-weight:900;letter-spacing:-2px;fill:#fff}
.sub{font-family:Arial,Helvetica,sans-serif;font-weight:700;fill:#f8fafc}
.small{font-family:Arial,Helvetica,sans-serif;font-weight:600;fill:#cbd5e1}
.dark{font-family:Arial,Helvetica,sans-serif;font-weight:900;fill:#111827}
.muted{font-family:Arial,Helvetica,sans-serif;font-weight:700;fill:#475569}
.tag{font-family:Arial,Helvetica,sans-serif;font-weight:800;fill:#0f172a}
</style>
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#080816"/>
        <stop offset="45%" stop-color="#4c1d95"/>
        <stop offset="100%" stop-color="#fb923c"/>
      </linearGradient>
      <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#f8fafc"/>
      </linearGradient>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#000" flood-opacity="0.35"/>
      </filter>
      <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="45"/>
      </filter>
    </defs>
    
    
    <rect width="100%" height="100%" fill="url(#bg)"/>
    <circle cx="820" cy="150" r="260" fill="#f97316" opacity="0.3" filter="url(#soft)"/>
    <text x="70" y="250" class="title" font-size="92">100 AI
Influencer
Prompts</text>
    <rect x="70" y="395" width="830" height="150" rx="44" fill="#fff" opacity="0.95"/>
    <text x="110" y="485" class="dark" font-size="38">Selfies • Travel • Fashion • Video</text>
    
    <g filter="url(#shadow)">
      <rect x="155" y="820" width="690" height="460" rx="34" fill="url(#card)"/>
      <rect x="155" y="820" width="690" height="160" rx="34" fill="#f97316"/>
      <rect x="155" y="940" width="690" height="70" fill="#f97316"/>
      <text x="203" y="916" font-family="Arial" font-size="42" font-weight="900" fill="#fff">PDF</text>
      <text x="203" y="1065" font-family="Arial" font-size="52" font-weight="900" fill="#111827">PDF Bundle</text>
      <rect x="203" y="1130" width="594" height="18" rx="9" fill="#e5e7eb"/>
      <rect x="203" y="1175" width="510" height="18" rx="9" fill="#e5e7eb"/>
      <rect x="203" y="1220" width="555" height="18" rx="9" fill="#e5e7eb"/>
      <circle cx="735" cy="1180" r="50" fill="#f97316" opacity="0.9"/>
    </g>
    <text x="70" y="1375" class="small" font-size="38">Copy, customize, generate content</text>
    
    </svg>